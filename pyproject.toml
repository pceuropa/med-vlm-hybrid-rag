[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medvlm-hybrid-rag"
version = "0.1.0"
description = "HybridRAG pipeline for medical documentation using multimodal VLM parsing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph",
    "llama-index-core",
    "llama-index-graph-stores-neo4j",
    "llama-index-vector-stores-qdrant",
    "neo4j",
    "pdf2image",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "sentence-transformers",
    "streamlit",
    "torch",
    "torchvision",
    "transformers"
]
