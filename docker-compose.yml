version: '3.8'

services:
  db_graph:
    image: neo4j:5.26-community
    container_name: db_graph
    ports:
      - "7474:7474" # HTTP GUI
      - "7687:7687" # Bolt Protocol (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/pass
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  db_vector:
    image: qdrant/qdrant:v1.18
    container_name: db_vector
    ports:
      - "6333:6333" # REST API (Python client)
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_storage:
